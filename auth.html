<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in or create an account for Patient Management System." />
    <title>Patient Management - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/auth.css" />
</head>

<body>
    <div class="bg-glow"></div>

    <nav class="auth-navbar">
        <div class="nav-inner">
            <a href="index.html" class="brand">
                <div class="brand-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                        stroke-linecap="round">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                </div>
                <span class="brand-text">Patient Management</span>
            </a>
            <a href="index.html" class="nav-link">← Back to Home</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                        stroke-linecap="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
                <h1 id="authTitle">Sign In</h1>
                <p id="authSubtitle">Enter your credentials to access the system.</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Sign In</button>
                <button class="auth-tab" id="registerTab" onclick="switchTab('register')">Register</button>
            </div>

            <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-field">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username" autocomplete="username"
                        required />
                    <span class="field-error" id="loginUsernameError"></span>
                </div>
                <div class="form-field">
                    <label for="loginPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="Enter your password"
                            autocomplete="current-password" required />
                        <button type="button" class="toggle-pass"
                            onclick="togglePassword('loginPassword', this)">👁</button>
                    </div>
                    <span class="field-error" id="loginPasswordError"></span>
                </div>
                <button type="submit" class="auth-submit" id="loginSubmitBtn">Sign In</button>
                <div class="auth-footer">
                    Don't have an account? <a onclick="switchTab('register')">Register here</a>
                </div>
            </form>

            <form class="auth-form" id="registerForm" style="display:none;" onsubmit="handleRegister(event)">
                <div class="form-field">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username" autocomplete="username"
                        required />
                    <span class="field-error" id="regUsernameError"></span>
                </div>
                <div class="form-field">
                    <label for="regPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" placeholder="Create a password"
                            autocomplete="new-password" required />
                        <button type="button" class="toggle-pass"
                            onclick="togglePassword('regPassword', this)">👁</button>
                    </div>
                    <span class="field-error" id="regPasswordError"></span>
                </div>
                <div class="form-field">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="regConfirmPassword" placeholder="Confirm your password"
                            autocomplete="new-password" required />
                        <button type="button" class="toggle-pass"
                            onclick="togglePassword('regConfirmPassword', this)">👁</button>
                    </div>
                    <span class="field-error" id="regConfirmError"></span>
                </div>
                <button type="submit" class="auth-submit" id="registerSubmitBtn">Create Account</button>
                <div class="auth-footer">
                    Already have an account? <a onclick="switchTab('login')">Sign in here</a>
                </div>
            </form>

            <div class="success-check" id="successState">
                <div class="check-circle">✓</div>
                <h2 id="successTitle">Account Created!</h2>
                <p id="successMsg">Redirecting you now...</p>
            </div>
        </div>
    </div>

    <script type="module" src="js/pages/auth.js"></script>
</body>

</html>
